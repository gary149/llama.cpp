name: Agent terminal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/agent/**'
      - 'common/console.*'
      - '.github/workflows/agent-terminal.yml'
  push:
    branches: [master]
    paths:
      - 'tools/agent/**'
      - 'common/console.*'
      - '.github/workflows/agent-terminal.yml'

jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Install terminal test dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r tools/agent/tests/requirements.txt
      - name: Configure
        shell: bash
        run: |
          terminal_tests=OFF
          if [ "$RUNNER_OS" != Windows ]; then terminal_tests=ON; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DGGML_NATIVE=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_HTTPLIB=ON -DLLAMA_BUILD_TESTS=ON -DLLAMA_AGENT_TERMINAL_TESTS=$terminal_tests -DPython3_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build build --config Debug --parallel 3 --target llama-agent test-agent-tui test-agent-inference-backend test-agent-http-inference-backend test-agent-tool-parser test-agent-permission test-agent-resources test-agent-session-file test-agent-compaction
      - name: Test
        run: ctest --test-dir build -C Debug -R '^agent-' --output-on-failure
      - name: Browser replay
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/tui-browser" @xterm/xterm@5.5.0 playwright@1.55.0
          "$RUNNER_TEMP/tui-browser/node_modules/.bin/playwright" install --with-deps chromium
          node tools/agent/tests/replay_terminal.mjs build/tools/agent/terminal-artifacts "$RUNNER_TEMP/tui-browser"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Windows'
        with:
          name: terminal-${{ matrix.os }}
          path: build/tools/agent/terminal-artifacts
